<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yojana Setu | योजना सेतु</title>
<meta name="description" content="Discover all Indian government schemes state-wise. Find eligibility, documents, and apply online or offline.">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8f9ff;--surface:#ffffff;--surface2:#f1f3ff;--border:#e2e5f5;
    --text:#1a1d3a;--text2:#4a5080;--text3:#8890b5;
    --primary:#4361ee;--primary-light:#eef1ff;--primary-dark:#2d46c4;
    --green:#10b981;--green-light:#ecfdf5;--orange:#f59e0b;--orange-light:#fffbeb;
    --red:#ef4444;--red-light:#fef2f2;--purple:#8b5cf6;--purple-light:#f5f3ff;
    --shadow:0 1px 3px rgba(67,97,238,.08),0 4px 16px rgba(67,97,238,.06);
    --shadow-lg:0 8px 32px rgba(67,97,238,.14);
    --radius:12px;--radius-lg:20px;--radius-sm:8px;
    --transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  .dark{
    --bg:#0f1117;--surface:#1a1d2e;--surface2:#242740;--border:#2d3155;
    --text:#f0f2ff;--text2:#a0a8d8;--text3:#5560a0;
    --primary:#6b83f5;--primary-light:#1a1f40;--primary-dark:#8fa0ff;
    --green:#34d399;--green-light:#052e16;--orange:#fbbf24;--orange-light:#2a1f05;
    --red:#f87171;--red-light:#2a0f0f;--purple:#a78bfa;--purple-light:#1e1330;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.4);
    --shadow-lg:0 8px 32px rgba(0,0,0,.5);
  }
  body{font-family:'Inter','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:var(--transition)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:500;transition:var(--transition);text-decoration:none}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(67,97,238,.3)}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
  .btn-outline:hover{background:var(--primary-light)}
  .btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border)}
  .btn-ghost:hover{background:var(--surface2);color:var(--text)}
  .btn-sm{padding:7px 14px;font-size:13px}
  .card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);transition:var(--transition)}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
  .badge-blue{background:var(--primary-light);color:var(--primary)}
  .badge-green{background:var(--green-light);color:var(--green)}
  .badge-orange{background:var(--orange-light);color:var(--orange)}
  .badge-red{background:var(--red-light);color:var(--red)}
  .badge-purple{background:var(--purple-light);color:var(--purple)}
  input,select,textarea{background:var(--surface);color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;font-family:inherit;width:100%;transition:var(--transition);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,97,238,.12)}
  .stars{display:flex;gap:2px}
  .star{cursor:pointer;font-size:20px;color:var(--border);transition:var(--transition)}
  .star.active{color:#f59e0b}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:var(--surface2)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chat-bubble-user{background:var(--primary);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:80%;margin-left:auto;font-size:14px}
  .chat-bubble-ai{background:var(--surface2);color:var(--text);border-radius:18px 18px 18px 4px;padding:10px 16px;max-width:80%;font-size:14px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade-in{animation:fadeIn .3s ease}
  .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  .typing-dot{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:spin .8s ease-in-out infinite}
  @media(max-width:768px){.hide-mobile{display:none!important}.grid-2{grid-template-columns:1fr!important}.grid-3{grid-template-columns:1fr!important}}
  .rscoe-logo{position:fixed;top:70px;right:16px;z-index:200;width:64px;height:64px;border-radius:50%;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25);border:3px solid white;cursor:pointer;transition:transform .2s}
  .rscoe-logo:hover{transform:scale(1.1)}
  .rscoe-logo img{width:100%;height:100%;object-fit:cover}
</style>
</head>

const StarRating = ({ rating, interactive = false, onChange }) => {
  const [hover, setHover] = useState(0);
  return (
    <div style={{display:"flex",gap:2}}>
      {[1,2,3,4,5].map(s => (
        <span key={s}
          style={{fontSize:interactive?22:14,cursor:interactive?"pointer":"default",color:(hover||rating)>=s?"#f59e0b":"var(--border)",transition:"color .15s"}}
          onClick={()=>interactive&&onChange&&onChange(s)}
          onMouseEnter={()=>interactive&&setHover(s)}
          onMouseLeave={()=>interactive&&setHover(0)}>★</span>
      ))}
    </div>
  );
};

const CategoryBadge = ({ category }) => {
  const map = {Education:"badge-blue",Agriculture:"badge-green",Health:"badge-red","Women & Child":"badge-purple",Housing:"badge-blue",Finance:"badge-orange",Employment:"badge-purple","Skill Development":"badge-purple","Social Welfare":"badge-green",Minorities:"badge-orange",Elderly:"badge-blue",Disability:"badge-blue",Sports:"badge-green",Environment:"badge-green"};
  return <span className={`badge ${map[category]||"badge-blue"}`}>{category}</span>;
};

function SchemeCard({ scheme, lang, t, onSelect, onBookmark, bookmarks }) {
  const isBookmarked = bookmarks.includes(scheme.id);
  const name = lang==="hi"&&scheme.nameHi?scheme.nameHi:lang==="mr"&&scheme.nameMr?scheme.nameMr:scheme.name;
  const desc = lang==="hi"&&scheme.shortDescHi?scheme.shortDescHi:lang==="mr"&&scheme.shortDescMr?scheme.shortDescMr:scheme.shortDesc;
  const eli = lang==="hi"&&scheme.eligibilityHi?scheme.eligibilityHi:lang==="mr"&&scheme.eligibilityMr?scheme.eligibilityMr:scheme.eligibility;
  return (
    <div className="card fade-in" style={{padding:"20px",cursor:"pointer",position:"relative",overflow:"hidden"}} onClick={()=>onSelect(scheme)}>
      {scheme.trending&&<div style={{position:"absolute",top:12,right:12,background:"var(--orange-light)",color:"var(--orange)",fontSize:11,fontWeight:600,padding:"3px 8px",borderRadius:999}}>🔥 {t.trending}</div>}
      <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:12}}>
        <div style={{flex:1}}>
          <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:"var(--text)",lineHeight:1.4}}>{name}</h3>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
            <CategoryBadge category={scheme.category}/>
            <span style={{fontSize:12,color:"var(--text3)",padding:"4px 8px",background:"var(--surface2)",borderRadius:999}}>{scheme.state==="Central Government"?"🇮🇳 "+t.central:scheme.state}</span>
          </div>
        </div>
      </div>

function ChatWidget({ lang, t, isOpen, onClose }) {
  const [msgs, setMsgs] = useState([{role:"ai",text:`🙏 ${lang==="hi"?"नमस्ते! मैं भारत योजना सहायक हूं।":lang==="mr"?"नमस्कार! मी भारत योजना सहाय्यक आहे.":"Hello! I am your Yojana Setu AI Assistant. Ask me about any scheme!"}`}]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef();
  useEffect(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);

  const send = async () => {
    if(!input.trim()||loading)return;
    const userMsg = input;
    setInput("");
    setMsgs(m=>[...m,{role:"user",text:userMsg}]);
    setLoading(true);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",max_tokens:400,
          system:CHATBOT_KNOWLEDGE,
          messages:[...msgs.filter((m,i)=>!(m.role==="ai"&&i===0)).map(m=>({role:m.role==="ai"?"assistant":"user",content:m.text})),{role:"user",content:userMsg}]
        })
      });
      const data = await res.json();
      setMsgs(m=>[...m,{role:"ai",text:data.content?.[0]?.text||"Sorry, try again."}]);
    } catch(e) {
      setMsgs(m=>[...m,{role:"ai",text:"Unable to connect. Please try again later."}]);
    }
    setLoading(false);
  };

  if(!isOpen)return null;
  return (
    <div style={{position:"fixed",bottom:90,right:20,width:360,maxWidth:"calc(100vw - 32px)",background:"var(--surface)",borderRadius:20,boxShadow:"0 20px 60px rgba(0,0,0,.2)",border:"1px solid var(--border)",zIndex:1000,display:"flex",flexDirection:"column",height:480}}>
      <div style={{padding:"16px 20px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--primary)",borderRadius:"20px 20px 0 0"}}>
        <div>
          <div style={{fontSize:14,fontWeight:600,color:"#fff"}}>🤖 {t.chatTitle}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,.7)"}}>{t.poweredBy}</div>
        </div>
        <button onClick={onClose} style={{background:"rgba(255,255,255,.2)",border:"none",color:"#fff",width:28,height:28,borderRadius:"50%",cursor:"pointer",fontSize:16}}>×</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:12}}>
        {msgs.map((m,i)=>(
          <div key={i} className={m.role==="user"?"chat-bubble-user":"chat-bubble-ai"} style={{alignSelf:m.role==="user"?"flex-end":"flex-start",lineHeight:1.6}}>{m.text}</div>
        ))}
        {loading&&<div className="chat-bubble-ai" style={{display:"flex",gap:6,alignItems:"center"}}>
          <div className="typing-dot" style={{animationDelay:"0s"}}/>
          <div className="typing-dot" style={{animationDelay:".2s"}}/>
          <div className="typing-dot" style={{animationDelay:".4s"}}/>
        </div>}
        <div ref={bottomRef}/>
      </div>
      <div style={{padding:"12px 16px",borderTop:"1px solid var(--border)",display:"flex",gap:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} placeholder={t.chatPlaceholder} onKeyDown={e=>e.key==="Enter"&&send()} style={{flex:1,fontSize:13}}/>
        <button className="btn btn-primary btn-sm" onClick={send} disabled={loading}>{loading?"...":t.send}</button>
      </div>
    </div>
  );
}

function RecommendWidget({ t, schemes, onSelect }) {
  const [age, setAge] = useState("");
  const [income, setIncome] = useState("");
  const [result, setResult] = useState(null);

  const getRecommendations = () => {
    const a = parseInt(age), inc = parseInt(income);
    let recs = [...schemes];
    if(a && a < 35) recs = recs.filter(s=>["Skill Development","Education","Finance","Women & Child","Employment"].includes(s.category));
    if(a && a > 60) recs = recs.filter(s=>["Health","Social Welfare","Finance"].includes(s.category));
    if(inc && inc < 200000) recs = recs.filter(s=>["Health","Housing","Agriculture","Finance","Social Welfare"].includes(s.category));
    setResult(recs.slice(0,3).length?recs.slice(0,3):schemes.slice(0,3));
  };

  return (
    <div className="card" style={{padding:24,marginBottom:24}}>
      <h3 style={{fontSize:17,fontWeight:600,marginBottom:16,color:"var(--text)"}}>🎯 {t.recommend}</h3>

        <div>
          <label style={{fontSize:12,color:"var(--text2)",marginBottom:6,display:"block"}}>👤 {t.age}</label>
          <input type="number" placeholder="e.g. 28" value={age} onChange={e=>setAge(e.target.value)} min="0" max="120"/>
        </div>
        <div>
          <label style={{fontSize:12,color:"var(--text2)",marginBottom:6,display:"block"}}>💰 {t.income}</label>
          <input type="number" placeholder="e.g. 250000" value={income} onChange={e=>setIncome(e.target.value)}/>
        </div>
        <button className="btn btn-primary" onClick={getRecommendations} style={{whiteSpace:"nowrap"}}>{t.getRecommendations}</button>
      </div>
      {result&&<div style={{marginTop:16,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:12}}>
        {result.map(s=>(
          <div key={s.id} onClick={()=>onSelect(s)} style={{background:"var(--primary-light)",borderRadius:12,padding:14,cursor:"pointer",border:"1px solid var(--border)"}}>
            <div style={{fontSize:13,fontWeight:600,color:"var(--text)",marginBottom:6}}>{s.name}</div>
            <CategoryBadge category={s.category}/>
            <p style={{fontSize:12,color:"var(--text2)",marginTop:8,lineHeight:1.5}}>{s.shortDesc?.substring(0,70)}...</p>
          </div>
        ))}
      </div>}
    </div>
  );
}

                <div style={{fontSize:22,fontWeight:700,color:"var(--primary)"}}>{val}</div>
                <div style={{fontSize:12,color:"var(--text3)"}}>{label}</div>
              </div>
            ))}
          </div>

          <RecommendWidget t={t} schemes={schemes} onSelect={openScheme}/>

          {/* MAHARASHTRA SECTION */}
          <div style={{background:"linear-gradient(135deg,#fff7ed,#fef3c7)",borderRadius:20,padding:28,border:"2px solid #f59e0b",marginBottom:32}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <span style={{fontSize:32}}>🏛️</span>
              <div>
                <h2 style={{fontSize:20,fontWeight:700,color:"var(--text)"}}>{t.maharashtraSchemes}</h2>
                <p style={{fontSize:13,color:"var(--text3)"}}>{mhSchemes.length} {t.schemesAvail}</p>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:16}} className="grid-3">
              {mhSchemes.map(s=><SchemeCard key={s.id} scheme={s} lang={lang} t={t} onSelect={openScheme} onBookmark={toggleBookmark} bookmarks={bookmarks}/>)}
            </div>
          </div>

          <h2 style={{fontSize:20,fontWeight:700,marginBottom:16,color:"var(--text)"}}>🔥 {t.featuredSchemes}</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:20,marginBottom:36}} className="grid-3">
            {schemes.filter(s=>s.trending&&s.state!=="Maharashtra").slice(0,6).map(s=>(
              <SchemeCard key={s.id} scheme={s} lang={lang} t={t} onSelect={openScheme} onBookmark={toggleBookmark} bookmarks={bookmarks}/>
            ))}
          </div>

          <div style={{background:"var(--surface)",borderRadius:20,padding:28,border:"1px solid var(--border)",marginBottom:32}}>
            <h2 style={{fontSize:20,fontWeight:700,marginBottom:20,textAlign:"center",color:"var(--text)"}}>{t.howItWorks}</h2>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:20}}>
              {[[1,"🗺️",t.step1,t.step1Desc,"var(--primary-light)","var(--primary)"],[2,"🏷️",t.step2,t.step2Desc,"var(--green-light)","var(--green)"],[3,"🖥️",t.step3,t.step3Desc,"var(--orange-light)","var(--orange)"]].map(([n,icon,title,desc,bg,col])=>(
                <div key={n} style={{textAlign:"center",padding:20,background:bg,borderRadius:16}}>
                  <div style={{width:48,height:48,borderRadius:"50%",background:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,margin:"0 auto 12px",boxShadow:"0 2px 8px rgba(0,0,0,.1)"}}>{icon}</div>
                  <div style={{fontSize:12,fontWeight:700,color:col,marginBottom:6}}>{t.step} {n}</div>
                  <div style={{fontSize:14,fontWeight:600,color:"var(--text)",marginBottom:6}}>{title}</div>
                  <div style={{fontSize:13,color:"var(--text2)",lineHeight:1.5}}>{desc}</div>
                </div>
              ))}
            </div>
          </div>

          <h2 style={{fontSize:20,fontWeight:700,marginBottom:16,color:"var(--text)"}}>📂 {t.browseCat}</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:12,marginBottom:32}}>
            {CATEGORIES.map(cat=>(
              <button key={cat} onClick={()=>{setFilterCat(cat);setPage("schemes");}}
                style={{padding:"14px 10px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,cursor:"pointer",textAlign:"center",transition:"all .2s"}}
                onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px)"}
                onMouseLeave={e=>e.currentTarget.style.transform=""}>
                <div style={{fontSize:24,marginBottom:6}}>{icons[cat]||"📋"}</div>
                <div style={{fontSize:12,fontWeight:500,color:"var(--text2)"}}>{cat}</div>
              </button>
            ))}
          </div>
        </>}

        {/* SCHEMES PAGE */}
        {page==="schemes"&&!selectedScheme&&<>
          <div style={{marginBottom:24}}>
            <h1 style={{fontSize:24,fontWeight:700,marginBottom:4,color:"var(--text)"}}>📋 {t.schemes}</h1>
            <p style={{fontSize:14,color:"var(--text3)"}}>{filtered.length} {t.schemesFound}</p>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12,marginBottom:24,alignItems:"end"}}>
            <div style={{position:"relative"}}>
              <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"var(--text3)"}}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={t.searchPlaceholder} style={{paddingLeft:38}}/>
            </div>
            <select value={filterState} onChange={e=>setFilterState(e.target.value)}>
              <option value="">{t.allStates}</option>
              {STATES.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
            <select value={filterCat} onChange={e=>setFilterCat(e.target.value)}>
              <option value="">{t.allCategories}</option>
              {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            {(search||filterState||filterCat)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setSearch("");setFilterState("");setFilterCat("");}}>✕ {t.clearFilters}</button>}
          </div>
          {filtered.length===0?<p style={{textAlign:"center",color:"var(--text3)",padding:"40px 0",fontSize:16}}>{t.noSchemes}</p>:
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:20}} className="grid-3">
              {filtered.map(s=><SchemeCard key={s.id} scheme={s} lang={lang} t={t} onSelect={openScheme} onBookmark={toggleBookmark} bookmarks={bookmarks}/>)}
            </div>
          }
        </>}

        {/* SAVED PAGE */}
        {page==="saved"&&!selectedScheme&&<>
          <h1 style={{fontSize:24,fontWeight:700,marginBottom:20,color:"var(--text)"}}>🔖 {t.savedSchemes}</h1>
          {bookmarks.length===0?<div style={{textAlign:"center",padding:"60px 20px"}}>
            <div style={{fontSize:48,marginBottom:12}}>🔖</div>
            <p style={{color:"var(--text3)",fontSize:16}}>{t.noSavedYet}</p>
            <button className="btn btn-primary" style={{marginTop:16}} onClick={()=>setPage("schemes")}>{t.browseSchemes}</button>
          </div>:
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:20}} className="grid-3">
              {schemes.filter(s=>bookmarks.includes(s.id)).map(s=><SchemeCard key={s.id} scheme={s} lang={lang} t={t} onSelect={openScheme} onBookmark={toggleBookmark} bookmarks={bookmarks}/>)}
            </div>
          }
        </>}

        {adminMode&&page==="home"&&<div className="card" style={{padding:24,marginTop:24,borderColor:"var(--orange)"}}>
          <h3 style={{fontSize:16,fontWeight:600,marginBottom:16,color:"var(--orange)"}}>🔐 {t.adminPanel}</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>
            <div style={{background:"var(--surface2)",borderRadius:12,padding:16,textAlign:"center"}}>
              <div style={{fontSize:32,fontWeight:700,color:"var(--primary)"}}>{schemes.length}</div>
              <div style={{fontSize:13,color:"var(--text2)"}}>{t.totalSchemes}</div>
            </div>
            <div style={{background:"var(--surface2)",borderRadius:12,padding:16,textAlign:"center"}}>
              <div style={{fontSize:32,fontWeight:700,color:"var(--green)"}}>{schemes.reduce((a,s)=>a+s.reviews.length,0)}</div>
              <div style={{fontSize:13,color:"var(--text2)"}}>{t.totalReviews}</div>
            </div>
            <div style={{background:"var(--surface2)",borderRadius:12,padding:16,textAlign:"center"}}>
              <div style={{fontSize:32,fontWeight:700,color:"var(--orange)"}}>{bookmarks.length}</div>
              <div style={{fontSize:13,color:"var(--text2)"}}>{t.totalBookmarked}</div>
            </div>
          </div>
          <p style={{fontSize:13,color:"var(--text3)",marginTop:12}}>{t.adminNote}</p>
        </div>}

        {selectedScheme&&<SchemeDetail scheme={selectedScheme} lang={lang} t={t} onBack={()=>{setSelectedScheme(null);setPage("schemes");}} onBookmark={toggleBookmark} bookmarks={bookmarks}/>}
      </main>

      <button onClick={()=>setChatOpen(o=>!o)}
        style={{position:"fixed",bottom:20,right:20,width:56,height:56,borderRadius:"50%",background:"var(--primary)",color:"#fff",border:"none",cursor:"pointer",fontSize:24,boxShadow:"0 4px 20px rgba(67,97,238,.4)",zIndex:999,transition:"all .2s"}}
        onMouseEnter={e=>{e.currentTarget.style.transform="scale(1.1)";}}
        onMouseLeave={e=>{e.currentTarget.style.transform="scale(1)";}}>🤖</button>

      <ChatWidget lang={lang} t={t} isOpen={chatOpen} onClose={()=>setChatOpen(false)}/>

      <footer style={{background:"var(--surface)",borderTop:"1px solid var(--border)",padding:"32px 20px",marginTop:40}}>
        <div style={{maxWidth:1200,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:24}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:24}}>🇮🇳</span><span style={{fontSize:16,fontWeight:700,color:"var(--primary)"}}>{t.appName}</span></div>
            <p style={{fontSize:13,color:"var(--text3)",lineHeight:1.7}}>{t.footerTagline}</p>
          </div>
          <div>
            <h4 style={{fontSize:13,fontWeight:600,color:"var(--text)",marginBottom:10}}>{t.quickLinks}</h4>
            {[[t.home,"home"],[t.allSchemes,"schemes"],[t.savedSchemes,"saved"],[t.aiAssistant,"chat"]].map(([label,p])=>(
              <div key={p} style={{fontSize:13,color:"var(--text3)",marginBottom:6,cursor:"pointer"}} onClick={()=>p==="chat"?setChatOpen(true):setPage(p)}>{label}</div>
            ))}
          </div>
          <div>
            <h4 style={{fontSize:13,fontWeight:600,color:"var(--text)",marginBottom:10}}>{t.categories}</h4>
            {CATEGORIES.slice(0,5).map(c=><div key={c} style={{fontSize:13,color:"var(--text3)",marginBottom:6,cursor:"pointer"}} onClick={()=>{setFilterCat(c);setPage("schemes");}}>{c}</div>)}
          </div>
          <div>
            <h4 style={{fontSize:13,fontWeight:600,color:"var(--text)",marginBottom:10}}>{t.officialLinks}</h4>
            {[["India.gov.in","https://india.gov.in"],["MyScheme Portal","https://www.myscheme.gov.in"],["MahaDbt Portal","https://mahadbt.maharashtra.gov.in"],["Aaple Sarkar","https://aaplesarkar.mahaonline.gov.in"]].map(([n,u])=><a key={n} href={u} target="_blank" rel="noopener" style={{display:"block",fontSize:13,color:"var(--primary)",marginBottom:6,textDecoration:"none"}}>{n} ↗</a>)}
          </div>
          <div>
            <h4 style={{fontSize:13,fontWeight:600,color:"var(--text)",marginBottom:10}}>{t.contactUs}</h4>
            <a href={`mailto:${t.contactEmail}`} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"var(--primary)",textDecoration:"none",wordBreak:"break-all"}}>
              <span>✉️</span>{t.contactEmail}
            </a>
          </div>
        </div>
        <div style={{maxWidth:1200,margin:"20px auto 0",paddingTop:16,borderTop:"1px solid var(--border)",textAlign:"center",fontSize:12,color:"var(--text3)"}}>
          {t.footerNote}
        </div>
      </footer>

      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"var(--surface)",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-around",padding:"8px 0",zIndex:50}} className="mobile-nav">
        <style>{`@media(min-width:769px){.mobile-nav{display:none!important}}`}</style>
        {[["home","🏠",t.home],["schemes","📋",t.schemes],["saved","🔖",t.saved],["chat","🤖",t.chat]].map(([p,icon,label])=>(
          <button key={p} onClick={()=>{if(p==="chat")setChatOpen(o=>!o);else{setPage(p);setSelectedScheme(null);}}}
            style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"4px 12px",color:page===p?"var(--primary)":"var(--text3)"}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:page===p?600:400}}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
