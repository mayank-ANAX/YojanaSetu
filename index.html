<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8f9ff;--surface:#ffffff;--surface2:#f1f3ff;--border:#e2e5f5;
    --text:#1a1d3a;--text2:#4a5080;--text3:#8890b5;
    --primary:#4361ee;--primary-light:#eef1ff;--primary-dark:#2d46c4;
    --green:#10b981;--green-light:#ecfdf5;--orange:#f59e0b;--orange-light:#fffbeb;
    --red:#ef4444;--red-light:#fef2f2;--purple:#8b5cf6;--purple-light:#f5f3ff;
    --shadow:0 1px 3px rgba(67,97,238,.08),0 4px 16px rgba(67,97,238,.06);
    --shadow-lg:0 8px 32px rgba(67,97,238,.14);
    --radius:12px;--radius-lg:20px;--radius-sm:8px;
    --transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  .dark{
    --bg:#0f1117;--surface:#1a1d2e;--surface2:#242740;--border:#2d3155;
    --text:#f0f2ff;--text2:#a0a8d8;--text3:#5560a0;
    --primary:#6b83f5;--primary-light:#1a1f40;--primary-dark:#8fa0ff;
    --green:#34d399;--green-light:#052e16;--orange:#fbbf24;--orange-light:#2a1f05;
    --red:#f87171;--red-light:#2a0f0f;--purple:#a78bfa;--purple-light:#1e1330;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.4);
    --shadow-lg:0 8px 32px rgba(0,0,0,.5);
  }
  body{font-family:'Inter','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:var(--transition)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:500;transition:var(--transition);text-decoration:none}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(67,97,238,.3)}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
  .btn-outline:hover{background:var(--primary-light)}
  .btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border)}
  .btn-ghost:hover{background:var(--surface2);color:var(--text)}
  .btn-sm{padding:7px 14px;font-size:13px}
  .card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);transition:var(--transition)}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
  .badge-blue{background:var(--primary-light);color:var(--primary)}
  .badge-green{background:var(--green-light);color:var(--green)}
  .badge-orange{background:var(--orange-light);color:var(--orange)}
  .badge-red{background:var(--red-light);color:var(--red)}
  .badge-purple{background:var(--purple-light);color:var(--purple)}
  input,select,textarea{background:var(--surface);color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;font-family:inherit;width:100%;transition:var(--transition);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,97,238,.12)}
  .stars{display:flex;gap:2px}
  .star{cursor:pointer;font-size:20px;color:var(--border);transition:var(--transition)}
  .star.active{color:#f59e0b}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:var(--surface2)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .chat-bubble-user{background:var(--primary);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:80%;margin-left:auto;font-size:14px}
  .chat-bubble-ai{background:var(--surface2);color:var(--text);border-radius:18px 18px 18px 4px;padding:10px 16px;max-width:80%;font-size:14px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade-in{animation:fadeIn .3s ease}
  .spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  .typing-dot{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:spin .8s ease-in-out infinite}
  @media(max-width:768px){
    .hide-mobile{display:none!important}
    .grid-2{grid-template-columns:1fr!important}
    .grid-3{grid-template-columns:1fr!important}
    /* Navbar: prevent text overflow */
    nav .app-title{font-size:13px!important;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* Give bottom nav space */
    body{padding-bottom:70px}
    main{padding:16px 12px!important}
    /* Hero section */
    .hero-section{padding:24px 16px 20px!important}
    .hero-section h1{font-size:22px!important}
    .hero-section p{font-size:14px!important}
    .hero-search{flex-direction:column!important;gap:10px!important}
    .hero-search>*{flex:unset!important;width:100%!important}
    /* Recommend widget grid */
    .recommend-grid{grid-template-columns:1fr!important}
    /* Move AI chat button above bottom nav */
    .chat-fab{bottom:80px!important}
    /* Chat widget position */
    .chat-widget{bottom:140px!important;right:12px!important;left:12px!important;width:auto!important;max-width:100%!important}
    /* Navbar right controls */
    .nav-controls{gap:4px!important}
    .nav-controls select{padding:4px 6px!important;font-size:12px!important}
    .nav-controls .btn{padding:5px 8px!important;font-size:12px!important}
    /* Scheme detail tweaks */
    .scheme-detail-header{flex-direction:column!important}
    /* Footer */
    footer{padding:20px 12px!important;margin-bottom:70px}
    .filters-grid{grid-template-columns:1fr!important}
    .scheme-cards-grid{grid-template-columns:1fr!important}
    /* Login modal */
    .login-modal{width:calc(100vw - 32px)!important;padding:20px!important}
    /* Stats grid */
    .stats-grid{grid-template-columns:repeat(2,1fr)!important}
  }

const StarRating = ({ rating, interactive = false, onChange }) => {
  const [hover, setHover] = useState(0);
  return (
    <div style={{display:'flex',gap:2}}>
      {[1,2,3,4,5].map(s => (
        <span key={s}
          style={{fontSize:interactive?22:16,cursor:interactive?'pointer':'default',color:s<=(hover||rating)?'#f59e0b':'var(--border)',transition:'color .15s'}}
          onMouseEnter={()=>interactive&&setHover(s)}
          onMouseLeave={()=>interactive&&setHover(0)}
          onClick={()=>interactive&&onChange&&onChange(s)}>★</span>
      ))}
    </div>
  );
};

const CategoryBadge = ({ category }) => {
  const colors = {
    Agriculture:'green',Education:'blue',Health:'red','Women & Child':'pink',
    Housing:'blue',Finance:'amber',Employment:'teal','Skill Development':'purple',
    'Social Welfare':'orange','Minorities':'purple','Elderly':'gray','Disability':'teal',Sports:'green',Environment:'green'
  };
  const c = colors[category] || 'blue';
  return <span className={`badge badge-${c==='teal'?'blue':c==='amber'?'orange':c==='gray'?'ghost':''+c}`}
    style={{background:`var(--${c==='amber'?'orange':c==='teal'?'primary':c}-light,var(--primary-light))`,
    color:`var(--${c==='amber'?'orange':c==='teal'?'primary':c},var(--primary))`}}>{category}</span>;
};

function SchemeCard({ scheme, lang, t, onSelect, onBookmark, bookmarks }) {
  const name = lang==='hi'&&scheme.nameHi?scheme.nameHi:lang==='mr'&&scheme.nameMr?scheme.nameMr:scheme.name;
  const desc = lang==='hi'&&scheme.shortDescHi?scheme.shortDescHi:lang==='mr'&&scheme.shortDescMr?scheme.shortDescMr:scheme.shortDesc;
  const eli = lang==='hi'&&scheme.eligibilityHi?scheme.eligibilityHi:lang==='mr'&&scheme.eligibilityMr?scheme.eligibilityMr:scheme.eligibility;
  const isBookmarked = bookmarks.includes(scheme.id);
  return (
    <div className="card fade-in" style={{padding:'20px',cursor:'pointer',position:'relative',overflow:'hidden'}} onClick={()=>onSelect(scheme)}>
      {scheme.trending&&<div style={{position:'absolute',top:12,right:12,background:'var(--orange-light)',color:'var(--orange)',fontSize:11,fontWeight:600,padding:'3px 8px',borderRadius:999}}>🔥 {t.trending}</div>}
      <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:12}}>
        <div style={{flex:1}}>
          <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'var(--text)',lineHeight:1.4}}>{name}</h3>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
            <CategoryBadge category={scheme.category}/>
            <span style={{fontSize:12,color:'var(--text3)',padding:'4px 8px',background:'var(--surface2)',borderRadius:999}}>{scheme.state==='Central Government'?'🇮🇳 '+t.central:scheme.state}</span>
          </div>
        </div>
      </div>
      <p style={{fontSize:13,color:'var(--text2)',marginBottom:10,lineHeight:1.6}}>{desc}</p>
      <p style={{fontSize:12,color:'var(--text3)',marginBottom:14,lineHeight:1.5}}><strong style={{color:'var(--text2)'}}>📋 {t.eligibility}:</strong> {eli?.substring(0,80)}...</p>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <StarRating rating={scheme.rating}/>
          <span style={{fontSize:12,color:'var(--text3)'}}>{scheme.rating}/5</span>
        </div>
        <div style={{display:'flex',gap:8}} onClick={e=>e.stopPropagation()}>
          <button className="btn btn-ghost btn-sm" onClick={()=>onBookmark(scheme.id)}
            style={{color:isBookmarked?'var(--orange)':'var(--text2)',borderColor:isBookmarked?'var(--orange)':'var(--border)'}}>
            {isBookmarked?'🔖':' 🔖'} {isBookmarked?t.bookmarked:t.bookmarkSave}
          </button>
          <button className="btn btn-primary btn-sm" onClick={()=>onSelect(scheme)}>{t.learnMore}</button>
        </div>
      </div>
    </div>
  );
}

function SchemeDetail({ scheme, lang, t, onBack, onBookmark, bookmarks }) {
  const [reviews, setReviews] = useState(scheme.reviews || []);
  const [name2, setName2] = useState('');
  const [reviewText, setReviewText] = useState('');
  const [rating, setRating] = useState(0);
  const [user] = useState(null);
  const isBookmarked = bookmarks.includes(scheme.id);
  const sName = lang==='hi'&&scheme.nameHi?scheme.nameHi:lang==='mr'&&scheme.nameMr?scheme.nameMr:scheme.name;
  const sDesc = lang==='hi'&&scheme.shortDescHi?scheme.shortDescHi:lang==='mr'&&scheme.shortDescMr?scheme.shortDescMr:scheme.shortDesc;

  const submitReview = () => {
    if(!name2||!reviewText||!rating)return;
    setReviews([...reviews,{id:Date.now(),name:name2,rating,review:reviewText,date:new Date().toISOString().slice(0,10)}]);
    setName2('');setReviewText('');setRating(0);
  };

  return (
    <div className="fade-in" style={{maxWidth:820,margin:'0 auto',padding:'0 0 40px'}}>
      <button className="btn btn-ghost btn-sm" style={{marginBottom:20}} onClick={onBack}>← {t.backToList}</button>
      
      <div className="card" style={{padding:'28px',marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12,marginBottom:16}}>
          <div style={{flex:1}}>
            <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
              <CategoryBadge category={scheme.category}/>
              <span style={{fontSize:12,color:'var(--text3)',padding:'4px 8px',background:'var(--surface2)',borderRadius:999}}>{scheme.state}</span>
              {scheme.trending&&<span style={{fontSize:12,background:'var(--orange-light)',color:'var(--orange)',padding:'4px 8px',borderRadius:999,fontWeight:600}}>🔥 Trending</span>}
            </div>
            <h1 style={{fontSize:24,fontWeight:700,color:'var(--text)',marginBottom:8}}>{sName}</h1>
            <p style={{fontSize:15,color:'var(--text2)',lineHeight:1.7}}>{sDesc}</p>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>onBookmark(scheme.id)}
            style={{color:isBookmarked?'var(--orange)':'var(--text2)',borderColor:isBookmarked?'var(--orange)':'var(--border)',whiteSpace:'nowrap'}}>
            🔖 {isBookmarked?t.bookmarked:t.bookmarkSave}
          </button>
        </div>

        <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 0',borderTop:'1px solid var(--border)',borderBottom:'1px solid var(--border)',marginBottom:20}}>
          <StarRating rating={scheme.rating}/>
          <span style={{fontSize:14,color:'var(--text2)',fontWeight:500}}>{scheme.rating}/5</span>
          <span style={{fontSize:13,color:'var(--text3)'}}>({reviews.length} {t.reviews})</span>
        </div>

        <h3 style={{fontSize:15,fontWeight:600,marginBottom:10,color:'var(--text)'}}>📝 About this Scheme</h3>
        <p style={{fontSize:14,color:'var(--text2)',lineHeight:1.8,marginBottom:20}}>{scheme.fullDesc}</p>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}} className="grid-2">
          <div style={{background:'var(--surface2)',borderRadius:12,padding:16}}>
            <h4 style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:10}}>✅ {t.eligibility}</h4>

function ChatWidget({ lang, t, isOpen, onClose }) {
  const [msgs, setMsgs] = useState([{role:'ai',text:`🙏 ${lang==='hi'?'नमस्ते! मैं भारत योजना सहायक हूं। आप किस योजना के बारे में जानना चाहते हैं?':lang==='mr'?'नमस्कार! मी भारत योजना सहाय्यक आहे. तुम्हाला कोणत्या योजनेबद्दल जाणून घ्यायचे आहे?':'Hello! I am your India Schemes AI Assistant. Ask me about any government scheme, eligibility, documents, or how to apply!'}`}]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef();
  useEffect(()=>bottomRef.current?.scrollIntoView({behavior:'smooth'}),[msgs]);

  const send = async () => {
    if(!input.trim()||loading)return;
    const userMsg = input;
    setInput('');
    setMsgs(m=>[...m,{role:'user',text:userMsg}]);
    setLoading(true);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',max_tokens:400,
          system:CHATBOT_KNOWLEDGE,
          messages:[...msgs.filter(m=>m.role!=='ai'||msgs.indexOf(m)>0).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text})),{role:'user',content:userMsg}]
        })
      });
      const data = await res.json();
      const reply = data.content?.[0]?.text || "Sorry, I couldn't get a response. Please try again.";
      setMsgs(m=>[...m,{role:'ai',text:reply}]);
    } catch(e) {
      setMsgs(m=>[...m,{role:'ai',text:'Unable to connect to AI. Please try again later.'}]);
    }
    setLoading(false);
  };

  if(!isOpen)return null;
  return (
    <div className="chat-widget" style={{position:'fixed',bottom:90,right:20,width:360,maxWidth:'calc(100vw - 32px)',background:'var(--surface)',borderRadius:20,boxShadow:'0 20px 60px rgba(0,0,0,.2)',border:'1px solid var(--border)',zIndex:1000,display:'flex',flexDirection:'column',height:480}}>
      <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--primary)',borderRadius:'20px 20px 0 0'}}>
        <div>
          <div style={{fontSize:14,fontWeight:600,color:'#fff'}}>🤖 {t.chatTitle}</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,.7)'}}>Powered by Claude AI • EN / हि / मर</div>
        </div>
        <button onClick={onClose} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',width:28,height:28,borderRadius:'50%',cursor:'pointer',fontSize:16}}>×</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:12}}>
        {msgs.map((m,i)=>(
          <div key={i} className={m.role==='user'?'chat-bubble-user':'chat-bubble-ai'} style={{alignSelf:m.role==='user'?'flex-end':'flex-start',lineHeight:1.6}}>{m.text}</div>
        ))}
        {loading&&<div className="chat-bubble-ai" style={{display:'flex',gap:6,alignItems:'center'}}>
          <div className="typing-dot" style={{animationDelay:'0s'}}/>
          <div className="typing-dot" style={{animationDelay:'.2s'}}/>
          <div className="typing-dot" style={{animationDelay:'.4s'}}/>
        </div>}
        <div ref={bottomRef}/>
      </div>
      <div style={{padding:'12px 16px',borderTop:'1px solid var(--border)',display:'flex',gap:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} placeholder={t.chatPlaceholder} onKeyDown={e=>e.key==='Enter'&&send()} style={{flex:1,fontSize:13}}/>
        <button className="btn btn-primary btn-sm" onClick={send} disabled={loading}>{loading?'...':t.send}</button>
      </div>
    </div>
  );
}

function RecommendWidget({ t, schemes, onSelect }) {
  const [age, setAge] = useState('');
  const [income, setIncome] = useState('');
  const [result, setResult] = useState(null);

  const getRecommendations = () => {
    const a = parseInt(age), inc = parseInt(income);
    let recs = [...schemes];
    if(a && a < 35) recs = recs.filter(s=>['Skill Development','Education','Finance','Women & Child'].includes(s.category));
    if(a && a > 60) recs = recs.filter(s=>['Health','Social Welfare','Finance'].includes(s.category));
    if(inc && inc < 200000) recs = recs.filter(s=>['Health','Housing','Agriculture','Finance'].includes(s.category));
    recs = recs.slice(0,3);
    setResult(recs.length?recs:schemes.slice(0,3));
  };

  return (
    <div className="card" style={{padding:24,marginBottom:24}}>
      <h3 style={{fontSize:17,fontWeight:600,marginBottom:16,color:'var(--text)'}}>🎯 {t.recommend}</h3>
      <div className="recommend-grid" style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:12,alignItems:'end',flexWrap:'wrap'}}>
        <div>
          <label style={{fontSize:12,color:'var(--text2)',marginBottom:6,display:'block'}}>👤 {t.age}</label>
          <input type="number" placeholder="e.g. 28" value={age} onChange={e=>setAge(e.target.value)} min="0" max="120"/>
        </div>
        <div>
          <label style={{fontSize:12,color:'var(--text2)',marginBottom:6,display:'block'}}>💰 {t.income}</label>
          <input type="number" placeholder="e.g. 250000" value={income} onChange={e=>setIncome(e.target.value)}/>
        </div>
        <button className="btn btn-primary" onClick={getRecommendations} style={{whiteSpace:'nowrap'}}>{t.getRecommendations}</button>
      </div>
      {result&&<div style={{marginTop:16,display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12}}>
        {result.map(s=>(
          <div key={s.id} onClick={()=>onSelect(s)} style={{background:'var(--primary-light)',borderRadius:12,padding:14,cursor:'pointer',border:'1px solid var(--border)'}}>
            <div style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:6}}>{s.name}</div>
            <CategoryBadge category={s.category}/>
            <p style={{fontSize:12,color:'var(--text2)',marginTop:8,lineHeight:1.5}}>{s.shortDesc?.substring(0,70)}...</p>
          </div>
        ))}
      </div>}
    </div>
  );
}

          </div>:
            <div className="scheme-cards-grid grid-3" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:16}}>
              {schemes.filter(s=>bookmarks.includes(s.id)).map(s=><SchemeCard key={s.id} scheme={s} lang={lang} t={t} onSelect={openScheme} onBookmark={toggleBookmark} bookmarks={bookmarks}/>)}
            </div>
          }
        </>}

        {/* ADMIN PANEL */}
        {adminMode&&page==='home'&&<div className="card" style={{padding:24,marginTop:24,borderColor:'var(--orange)'}}>
          <h3 style={{fontSize:16,fontWeight:600,marginBottom:16,color:'var(--orange)'}}>🔐 Admin Panel</h3>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12}}>
            <div style={{background:'var(--surface2)',borderRadius:12,padding:16,textAlign:'center'}}>
              <div style={{fontSize:32,fontWeight:700,color:'var(--primary)'}}>{schemes.length}</div>
              <div style={{fontSize:13,color:'var(--text2)'}}>Total Schemes</div>
            </div>
            <div style={{background:'var(--surface2)',borderRadius:12,padding:16,textAlign:'center'}}>
              <div style={{fontSize:32,fontWeight:700,color:'var(--green)'}}>{schemes.reduce((a,s)=>a+s.reviews.length,0)}</div>
              <div style={{fontSize:13,color:'var(--text2)'}}>Total Reviews</div>
            </div>
            <div style={{background:'var(--surface2)',borderRadius:12,padding:16,textAlign:'center'}}>
              <div style={{fontSize:32,fontWeight:700,color:'var(--orange)'}}>{bookmarks.length}</div>
              <div style={{fontSize:13,color:'var(--text2)'}}>Bookmarked</div>
            </div>
          </div>
          <p style={{fontSize:13,color:'var(--text3)',marginTop:12}}>Admin features: View all schemes, moderate reviews, export data. Full backend integration needed for production.</p>
        </div>}

        {/* SCHEME DETAIL */}
        {selectedScheme&&<SchemeDetail scheme={selectedScheme} lang={lang} t={t} onBack={()=>{setSelectedScheme(null);}} onBookmark={toggleBookmark} bookmarks={bookmarks}/>}
      </main>

      {/* AI CHAT BUTTON */}
      <button className="chat-fab" onClick={()=>setChatOpen(o=>!o)}
        style={{position:'fixed',bottom:20,right:20,width:56,height:56,borderRadius:'50%',background:'var(--primary)',color:'#fff',border:'none',cursor:'pointer',fontSize:24,boxShadow:'0 4px 20px rgba(67,97,238,.4)',zIndex:999,transition:'all .2s'}}
        onMouseEnter={e=>{e.currentTarget.style.transform='scale(1.1)';}}
        onMouseLeave={e=>{e.currentTarget.style.transform='scale(1)';}}>🤖</button>

      <ChatWidget lang={lang} t={t} isOpen={chatOpen} onClose={()=>setChatOpen(false)}/>

      {/* FOOTER */}
      <footer style={{background:'var(--surface)',borderTop:'1px solid var(--border)',padding:'32px 20px',marginTop:40}}>
        <div style={{maxWidth:1200,margin:'0 auto',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:24}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}><span style={{fontSize:24}}>🇮🇳</span><span style={{fontSize:16,fontWeight:700,color:'var(--primary)'}}>India Schemes</span></div>
            <p style={{fontSize:13,color:'var(--text3)',lineHeight:1.7}}>Empowering citizens to discover and apply for government schemes in their language.</p>
          </div>
          <div>
            <h4 style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:10}}>Quick Links</h4>
            {['Home','All Schemes','Saved Schemes','AI Assistant'].map(l=><div key={l} style={{fontSize:13,color:'var(--text3)',marginBottom:6,cursor:'pointer'}} onClick={()=>setPage(l==='AI Assistant'?'home':l.toLowerCase().replace(' ','')==='allschemes'?'schemes':l.toLowerCase())}>{l}</div>)}
          </div>
          <div>
            <h4 style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:10}}>Categories</h4>
            {CATEGORIES.slice(0,5).map(c=><div key={c} style={{fontSize:13,color:'var(--text3)',marginBottom:6,cursor:'pointer'}} onClick={()=>{setFilterCat(c);setPage('schemes');}}>{c}</div>)}
          </div>
          <div>
            <h4 style={{fontSize:13,fontWeight:600,color:'var(--text)',marginBottom:10}}>Official Links</h4>
            {[['India.gov.in','https://india.gov.in'],['MyScheme Portal','https://www.myscheme.gov.in'],['JAM Trilogy','https://dbtbharat.gov.in']].map(([n,u])=><a key={n} href={u} target="_blank" rel="noopener" style={{display:'block',fontSize:13,color:'var(--primary)',marginBottom:6,textDecoration:'none'}}>{n} ↗</a>)}
          </div>
        </div>
        <div style={{maxWidth:1200,margin:'20px auto 0',paddingTop:16,borderTop:'1px solid var(--border)',textAlign:'center',fontSize:12,color:'var(--text3)'}}>
          Built with ❤️ for Indian citizens | Data sourced from official government portals | Not an official government website
        </div>
      </footer>

      {/* MOBILE BOTTOM NAV */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'var(--surface)',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-around',padding:'8px 0',zIndex:50}} className="mobile-nav">
        <style>{`@media(min-width:769px){.mobile-nav{display:none!important}}`}</style>
        {[['home','🏠','Home'],['schemes','📋','Schemes'],['saved','🔖','Saved'],['chat','🤖','AI']].map(([p,icon,label])=>(
          <button key={p} onClick={()=>{if(p==='chat')setChatOpen(o=>!o);else{setPage(p);setSelectedScheme(null);}}}
            style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'4px 12px',color:page===p?'var(--primary)':'var(--text3)'}}>
            <span style={{fontSize:22}}>{icon}</span>
            <span style={{fontSize:10,fontWeight:page===p?600:400}}>{label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
